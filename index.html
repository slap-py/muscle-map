<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="theme-color" content="#F7F5F0" />
    <script>(function(){try{var c=localStorage.getItem("muscle-map-theme");if(c==="light"||c==="dark")document.documentElement.dataset.theme=c;}catch(_){}})();</script>
    <meta name="description" content="Explore anatomy in 3D with Fabrica. Hide tissue layers, select structures, see modeled connections, and combine available leg regions." />
    <title>Home · Fabrica</title>
      <style>
 :root{--bg:#f7f5f0;--border:#d8d1c6;--muted:#756c62;--text:#393631;--accent:#2b62a0} @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#2e2b27;--border:#5e554b;--muted:#c5b9a7;--text:#f7f5f0;--accent:#86b8ff}} :root[data-theme="dark"]{--bg:#2e2b27;--border:#5e554b;--muted:#c5b9a7;--text:#f7f5f0;--accent:#86b8ff}
body{margin:0;font:16px/1.5 Inter,system-ui,sans-serif;color:var(--text);background:var(--bg)}
/* Loading screen */
#loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 16px;
  background: var(--bg);
  transition: opacity 0.35s;
}
#loading.done {
  opacity: 0;
  pointer-events: none;
}
#loading h1 {
  font-family: "Manrope Variable", Manrope, sans-serif;
  font-size: 24px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
#loading p {
  font-size: 14px;
  color: var(--muted);
}
.loading-bar {
  width: 160px;
  height: 3px;
  overflow: hidden;
  border-radius: 2px;
  background: var(--border);
}
.loading-bar::after {
  content: "";
  display: block;
  width: 40%;
  height: 100%;
  background: #B84E48;
  animation: loading-slide 1.1s ease-in-out infinite;
}
@keyframes loading-slide {
  from { transform: translateX(-100%); }
  to { transform: translateX(250%); }
}
@media (prefers-reduced-motion: reduce) {
  .loading-bar::after { animation: none; width: 100%; }
}
#loading.determinate .loading-bar::after{animation:none;transform:none;width:var(--progress,0%);transition:width .15s}
#loading.load-failed .loading-bar{display:none}
@media(prefers-reduced-motion:reduce){#loading,#loading.determinate .loading-bar::after{transition:none}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/app.ts"></script>
  </body>
</html>
