<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Foot &amp; Ankle Explorer</title>
      <style>
:root{--bg:#efede8;--border:#e2dfd8;--muted:#6d6a63;--accent:#2b62a0}
body{margin:0;font:13px/1.5 system-ui,sans-serif;background:var(--bg)}
/* Loading screen */
#loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  background: var(--bg);
  transition: opacity 0.35s;
}
#loading.done {
  opacity: 0;
  pointer-events: none;
}
#loading h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
#loading p {
  font-size: 12px;
  color: var(--muted);
}
.loading-bar {
  width: 160px;
  height: 3px;
  overflow: hidden;
  border-radius: 2px;
  background: var(--border);
}
.loading-bar::after {
  content: "";
  display: block;
  width: 40%;
  height: 100%;
  background: var(--accent);
  animation: loading-slide 1.1s ease-in-out infinite;
}
@keyframes loading-slide {
  from { transform: translateX(-100%); }
  to { transform: translateX(250%); }
}
@media (prefers-reduced-motion: reduce) {
  .loading-bar::after { animation: none; width: 100%; }
}
#loading .brand-mark{width:40px;height:40px;fill:none;stroke:var(--accent);stroke-width:1.5}
#loading.determinate .loading-bar::after{animation:none;transform:none;width:var(--progress,0%);transition:width .15s}
#loading.load-failed .loading-bar{display:none}
@media(prefers-reduced-motion:reduce){#loading,#loading.determinate .loading-bar::after{transition:none}}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" role="status" aria-live="polite"><svg class="brand-mark" viewBox="0 0 20 20" aria-hidden="true"><path d="M12 2c3-1 5 1 4 4l-2 5c-1 2 0 4-2 6-2 2-6 1-6-2 0-2 2-4 3-6s0-6 3-7Z"/><path d="m9 9 5 2"/></svg><h1>Foot &amp; Ankle Explorer</h1><div class="loading-bar" aria-hidden="true"></div><p>Loading models…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
