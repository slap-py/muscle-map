<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>Foot &amp; Ankle Explorer</title>
      <style>
:root{--bg:#efede8;--border:#e2dfd8;--muted:#6d6a63;--accent:#2b62a0}
body{margin:0;font:13px/1.5 system-ui,sans-serif;background:var(--bg)}
/* Loading screen */
#loading {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-content: center;
  justify-items: center;
  gap: 14px;
  background: var(--bg);
  transition: opacity 0.35s;
}
#loading.done {
  opacity: 0;
  pointer-events: none;
}
#loading h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: -0.01em;
}
#loading p {
  font-size: 12px;
  color: var(--muted);
}
.loading-bar {
  width: 160px;
  height: 3px;
  overflow: hidden;
  border-radius: 2px;
  background: var(--border);
}
.loading-bar::after {
  content: "";
  display: block;
  width: 40%;
  height: 100%;
  background: var(--accent);
  animation: loading-slide 1.1s ease-in-out infinite;
}
@keyframes loading-slide {
  from { transform: translateX(-100%); }
  to { transform: translateX(250%); }
}
@media (prefers-reduced-motion: reduce) {
  .loading-bar::after { animation: none; width: 100%; }
}
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" role="status" aria-live="polite"><h1>Foot &amp; Ankle Explorer</h1><div class="loading-bar" aria-hidden="true"></div><p>Loading anatomy models…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
